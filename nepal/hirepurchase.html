<!DOCTYPE html>
<html lang="en">
<head>
<title>Hire Purchase in Nepal</title>
<meta property="og:url" content="https://shyamkumarkc20.com.np/nepal/hirepurchase">
<link rel="shortcut icon" type="image/jpg" href="/brp.jpg">

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous">

<body>
<div id ="header"></div>
	<main>
<h2>Hire Purchase Companies In Nepal</h2>
<style>
table {
    border-collapse: collapse;
    border-spacing: 0;
    width: 100%;
    border: 1px solid #ddd;
}

th, td {
    text-align: left;
    padding: 16px;
}

tr:nth-child(even) {
    background-color: #f2f2f2
}
</style>
<p>


      <p id="data-output">
         <!-- Products from javascript file in here. -->
      </p>
   
 
   <script>
   fetch("https://shyamkumarkc20.com.np/js/hirepurchase.json")
.then(function(response){
   return response.json();
})
.then(function(products){
   let placeholder = document.querySelector("#data-output");
   let out = "";
   for(let product of products){
      out += `
         <tr>
            
            <p><b>${product.SNO}.
              ${product.Name}, 
			  ${product.OD}:</b></p>              
              <p>${product.Dp}</p> 
	               
            
         </tr>
      `;
   }
 
   placeholder.innerHTML = out;
});

$(function(){
$('#footer').load('/assets/footer.html');
});
</script><script>
  $(function(){
$('#footer').load('/assets/footer.html');
});
</script>

</main>
	<div id ="footer"></div>
</body>
  
</html>
