
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Presidents of Nepal: Current President and Complete List</title>
  <meta name="description" content="View the current President of Nepal in a featured section and explore the serially ordered list of all presidents with their tenure in AD and BS.">
  <meta name="author" content="SHYAM KUMAR K.C.">
  <link rel="canonical" href="https://shyamkumarkc20.com.np/president">
  <link rel="shortcut icon" type="image/jpeg" href="/brp.jpg">

  <style>
    :root {
      --primary: #123b72;
      --primary-light: #eaf1fb;
      --text: #202938;
      --muted: #687589;
      --border: #e1e7ef;
      --surface: #fff;
      --page: #f5f7fb;
      --green: #18794e;
      --green-light: #e8f7ef;
    }

    * {
      box-sizing: border-box;
    }

    

    .page-header {
      padding: 32px 0;
      background: var(--primary);
      color: white;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: clamp(27px, 4vw, 38px);
      line-height: 1.3;
    }

    .page-header p {
      margin: 0;
      max-width: 750px;
      color: #e0eafa;
    }

    .section {
      margin: 28px 0;
    }

    .section-heading {
      margin: 0 0 16px;
      color: var(--primary);
      font-size: clamp(22px, 3vw, 28px);
      line-height: 1.4;
    }

    .intro {
      padding: 20px;
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .intro h2 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 21px;
    }

    .intro p {
      margin: 0;
    }

    /* Featured current president */
    .current-president {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 25px;
      align-items: center;
      padding: 25px;
      background: var(--surface);
      border: 2px solid var(--green);
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(25, 45, 75, 0.06);
    }

    .current-photo-wrap {
      display: flex;
      justify-content: center;
    }

    .current-photo {
      width: 180px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--primary-light);
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 150px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 48px;
      font-weight: 700;
    }

    .current-label {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .current-name {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .current-name-nepali {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 18px;
    }

    .current-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-box {
      padding: 12px;
      background: var(--page);
      border: 1px solid var(--border);
      border-radius: 9px;
      min-width: 0;
    }

    .detail-box span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .detail-box strong {
      display: block;
      margin-top: 3px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    /* All presidents */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-box {
      width: min(100%, 320px);
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font-size: 15px;
    }

    .search-box:focus {
      outline: 2px solid #8db6ed;
      outline-offset: 2px;
    }

    .presidents-list {
      display: grid;
      gap: 14px;
    }

    .president-row {
      display: grid;
      grid-template-columns: 54px 90px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .serial-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
    }

    .president-photo {
      width: 82px;
      height: 90px;
      object-fit: cover;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--primary-light);
    }

    .president-row-name {
      margin: 0 0 5px;
      font-size: 19px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .president-row-nepali {
      margin: 0 0 8px;
      color: var(--muted);
    }

    .president-row-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .president-row-details strong {
      color: var(--text);
      font-weight: 600;
    }

    .former-label {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 20px;
      background: #eef1f5;
      color: #536174;
      font-size: 11px;
      font-weight: 700;
    }

    .current-row-label {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--green-light);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
    }

    .message {
      padding: 18px;
      margin: 15px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
    }

    .message.error {
      color: #b42318;
    }

    .page-note {
      margin: 25px 0 30px;
      padding: 15px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .current-president {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .current-photo {
        width: 150px;
        height: 165px;
      }

      .current-details {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .president-row {
        grid-template-columns: 42px 65px minmax(0, 1fr);
        gap: 11px;
        padding: 13px;
      }

      .serial-number {
        width: 38px;
        height: 38px;
        font-size: 16px;
      }

      .president-photo {
        width: 62px;
        height: 72px;
      }

      .president-row-name {
        font-size: 17px;
      }

      .president-row-details {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <div id="header"></div>

      <h1>Presidents of Nepal</h1>
      

  <main class="container">

    

    <!-- Separate section: current President -->
    <section class="section" aria-labelledby="currentHeading">
      <h2 class="section-heading" id="currentHeading">
        Current President of Nepal
      </h2>

      <div id="currentPresident">
        <p class="message">Loading current President...</p>
      </div>
    </section>

    <!-- Separate section: all presidents in serial order -->
    <section class="section" aria-labelledby="allPresidentsHeading">
      <div class="toolbar">
        <h2 class="section-heading" id="allPresidentsHeading">
          All Presidents of Nepal
        </h2>

        <input
          type="search"
          id="presidentSearch"
          class="search-box"
          placeholder="Search name or tenure..."
          aria-label="Search all presidents"
        >
      </div>

      <p id="resultCount" aria-live="polite"></p>

      <div id="presidentsList" class="presidents-list">
        <p class="message">Loading presidents list...</p>
      </div>
    </section>

   

  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    // Load shared website header and footer.
    $('#header').load('/assets/header.html', function (
      _response, status, xhr
    ) {
      if (status === 'error') {
        console.error('Header loading failed:', xhr.status);
      }
    });

    $('#footer').load('/assets/footer.html', function (
      _response, status, xhr
    ) {
      if (status === 'error') {
        console.error('Footer loading failed:', xhr.status);
      }
    });

    const PRESIDENTS_URL = '/js/presidents.json';

    const currentContainer =
      document.getElementById('currentPresident');

    const listContainer =
      document.getElementById('presidentsList');

    const searchInput =
      document.getElementById('presidentSearch');

    const resultCount =
      document.getElementById('resultCount');

    let presidents = [];

    function getField(record, fields) {
      for (const field of fields) {
        const value = record && record[field];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        ) {
          return String(value).trim();
        }
      }

      return '';
    }

    function isCurrent(record) {
      return getField(record, ['IsCurrent']).toLowerCase() === 'true';
    }

    function getImageURL(image) {
      if (!image) return '';

      if (/^https?:\/\//i.test(image) || image.startsWith('//')) {
        return image;
      }

      return '/' + image.replace(/^\/+/, '');
    }

    function createPlaceholder(name, className) {
      const placeholder = document.createElement('div');
      placeholder.className = 'photo-placeholder ' + className;
      placeholder.setAttribute('aria-hidden', 'true');
      placeholder.textContent = name ? name.charAt(0).toUpperCase() : 'P';
      return placeholder;
    }

    function createPortrait(record, className) {
      const name = getField(record, ['Name', 'name']);
      const image = getField(record, ['IMG', 'Image', 'Photo']);

      if (!image) {
        return createPlaceholder(name, className);
      }

      const portrait = document.createElement('img');
      portrait.className = className;
      portrait.src = getImageURL(image);
      portrait.alt = name || 'President of Nepal';
      portrait.loading = 'lazy';

      portrait.onerror = function () {
        portrait.replaceWith(createPlaceholder(name, className));
      };

      return portrait;
    }

    function createCurrentPresident(record) {
      currentContainer.replaceChildren();

      if (!record) {
        const message = document.createElement('p');
        message.className = 'message';
        message.textContent =
          'No current President found. Check IsCurrent in presidents.json.';
        currentContainer.appendChild(message);
        return;
      }

      const wrapper = document.createElement('article');
      wrapper.className = 'current-president';

      const photoWrap = document.createElement('div');
      photoWrap.className = 'current-photo-wrap';
      photoWrap.appendChild(createPortrait(record, 'current-photo'));

      const content = document.createElement('div');

      const badge = document.createElement('span');
      badge.className = 'current-label';
      badge.textContent = 'CURRENT PRESIDENT';

      const name = document.createElement('h3');
      name.className = 'current-name';
      name.textContent =
        getField(record, ['Name', 'name']) || 'Name not available';

      const nepaliName = getField(record, [
        'NameNepali', 'NepaliName', 'nameNepali'
      ]);

      content.append(badge, name);

      if (nepaliName) {
        const nepali = document.createElement('p');
        nepali.className = 'current-name-nepali';
        nepali.textContent = nepaliName;
        content.appendChild(nepali);
      }

      const details = document.createElement('div');
      details.className = 'current-details';

      const termAD = getField(record, ['TermAD', 'Term', 'Tenure']);
      const termBS = getField(record, ['TermBS']);

      if (termAD) {
        const adBox = document.createElement('div');
        adBox.className = 'detail-box';

        const label = document.createElement('span');
        label.textContent = 'Tenure (AD)';

        const value = document.createElement('strong');
        value.textContent = termAD;

        adBox.append(label, value);
        details.appendChild(adBox);
      }

      if (termBS) {
        const bsBox = document.createElement('div');
        bsBox.className = 'detail-box';

        const label = document.createElement('span');
        label.textContent = 'Tenure (BS)';

        const value = document.createElement('strong');
        value.textContent = termBS;

        bsBox.append(label, value);
        details.appendChild(bsBox);
      }

      content.appendChild(details);
      wrapper.append(photoWrap, content);
      currentContainer.appendChild(wrapper);
    }

    function createPresidentRow(record) {
      const row = document.createElement('article');
      row.className = 'president-row';

      const serial = document.createElement('div');
      serial.className = 'serial-number';
      serial.textContent = getField(record, ['SNO']) || '—';

      const photo = createPortrait(record, 'president-photo');

      const content = document.createElement('div');

      const name = document.createElement('h3');
      name.className = 'president-row-name';
      name.textContent =
        getField(record, ['Name', 'name']) || 'Name not available';

      content.appendChild(name);

      const nepaliName = getField(record, [
        'NameNepali', 'NepaliName', 'nameNepali'
      ]);

      if (nepaliName) {
        const nepali = document.createElement('p');
        nepali.className = 'president-row-nepali';
        nepali.textContent = nepaliName;
        content.appendChild(nepali);
      }

      const details = document.createElement('div');
      details.className = 'president-row-details';

      const termAD = getField(record, ['TermAD', 'Term', 'Tenure']);
      const termBS = getField(record, ['TermBS']);

      if (termAD) {
        const ad = document.createElement('span');
        ad.append('AD: ');

        const strong = document.createElement('strong');
        strong.textContent = termAD;
        ad.appendChild(strong);

        details.appendChild(ad);
      }

      if (termBS) {
        const bs = document.createElement('span');
        bs.append('BS: ');

        const strong = document.createElement('strong');
        strong.textContent = termBS;
        bs.appendChild(strong);

        details.appendChild(bs);
      }

      content.appendChild(details);

      const status = document.createElement('span');
      status.className = isCurrent(record)
        ? 'current-row-label'
        : 'former-label';
      status.textContent = isCurrent(record)
        ? 'CURRENT PRESIDENT'
        : 'FORMER PRESIDENT';

      content.appendChild(status);
      row.append(serial, photo, content);

      return row;
    }

    function renderAllPresidents(query = '') {
      const normalized = query.trim().toLowerCase();

      // Keep the historical list in ascending SNO order.
      const sorted = [...presidents].sort(function (a, b) {
        const aNumber = Number(getField(a, ['SNO'])) || 0;
        const bNumber = Number(getField(b, ['SNO'])) || 0;
        return aNumber - bNumber;
      });

      const filtered = sorted.filter(function (record) {
        const searchable = [
          getField(record, ['SNO']),
          getField(record, ['Name', 'name']),
          getField(record, ['NameNepali', 'NepaliName', 'nameNepali']),
          getField(record, ['TermAD', 'Term', 'Tenure']),
          getField(record, ['TermBS'])
        ].join(' ').toLowerCase();

        return searchable.includes(normalized);
      });

      listContainer.replaceChildren();

      if (filtered.length === 0) {
        const message = document.createElement('p');
        message.className = 'message';
        message.textContent = 'No presidents match your search.';
        listContainer.appendChild(message);
      } else {
        filtered.forEach(function (record) {
          listContainer.appendChild(createPresidentRow(record));
        });
      }

      resultCount.textContent =
        'Showing ' + filtered.length +
        (filtered.length === 1 ? ' president' : ' presidents');
    }

    async function loadPresidents() {
      try {
        const response = await fetch(PRESIDENTS_URL, {
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (Array.isArray(data)) {
          presidents = data;
        } else if (Array.isArray(data.presidents)) {
          presidents = data.presidents;
        } else if (Array.isArray(data.president)) {
          presidents = data.president;
        } else {
          throw new Error('JSON must be an array of president records.');
        }

        // Current president is shown only in the featured section.
        const currentPresident = presidents.find(isCurrent);
        createCurrentPresident(currentPresident);

        // All presidents appear serially in the second section.
        renderAllPresidents();

      } catch (error) {
        currentContainer.replaceChildren();
        listContainer.replaceChildren();

        const currentError = document.createElement('p');
        currentError.className = 'message error';
        currentError.textContent =
          'Unable to load the current President. Check /js/presidents.json.';

        const listError = document.createElement('p');
        listError.className = 'message error';
        listError.textContent =
          'Unable to load the presidents list. Check the JSON file path and format.';

        currentContainer.appendChild(currentError);
        listContainer.appendChild(listError);
        resultCount.textContent = '';

        console.error('Error loading presidents:', error);
      }
    }

    searchInput.addEventListener('input', function () {
      renderAllPresidents(searchInput.value);
    });

    loadPresidents();
  </script>

</body>
</html>
