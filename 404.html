<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Shyam Kumar KC</title>

    <meta name="robots" content="noindex, follow">

    <meta name="description"
          content="The page you are looking for could not be found. Explore other useful articles, tools and information on Shyam Kumar KC.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            background: #fff;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            color: #dc3545;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .home-btn:hover {
            background: #0056b3;
        }

        .links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .links a {
            color: #007bff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 75px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for doesn't exist,
            may have been moved, or the URL may be incorrect.
        </p>

        <a class="home-btn" href="/">
            ← Back to Homepage
        </a>

        <div class="links">
            <a href="/banking/">Banking</a>
            <a href="/tools/">Tools</a>
            <a href="/nepal/">Nepal</a>
        </div>

    </main>

</body>
</html>
