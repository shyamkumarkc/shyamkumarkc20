<!DOCTYPE html>
<html lang="en">
<head>
<title>Merger and Acquisition in Nepal</title>
<link rel="shortcut icon" type="image/jpg" href="/brp.jpg">
<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous">
</script>
<script>
$(function(){
$('#header').load('/assets/header.html');
});
</script>

</head>
<body>
<div id ="header"></div>

<h2>
Merger and Acquisition in Micro Finance </h2>


<br />
	<style>
        table {
          
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
<table border="black" >
<thead>
<tr>
<th>S.No.</th>
<th>BFI Name before Merger</th>
	<th>BFI Merged</th>
<th>BFI Name after Merger</th>


</tr>
</thead>

      <tbody id="data-output">
         <!-- Prodcuts from javascript file in here. -->
      </tbody>
   </table>
 
   <script>
   fetch("https://shyamkumarkc20.com.np/js/laghumerger.json")
.then(function(response){
   return response.json();
})
.then(function(products){
   let placeholder = document.querySelector("#data-output");
   let out = "";
   for(let product of products){
      out += `
         <tr>            
            <td>${product.SNo}</td>
             <td>${product.Name}</td>	   
			<td>${product.BFI}</td>			
			<td>${product.Merger}</td>            
            
         </tr>
      `;
   }
 
   placeholder.innerHTML = out;
});


$(function(){
$('#footer').load('/assets/footer.html');
});
</script>

</body>
  <div id ="footer"></div>
</html>
