
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nepali Currency - Coins and Characters</title>

    <meta name="description"
        content="Explore Nepalese currency coins, denominations, characters and other details of Nepali coins.">

    <link rel="canonical"
        href="https://shyamkumarkc20.com.np/article/nepalicurrencyhistory">

    <link rel="shortcut icon" type="image/jpg" href="/brp.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #222;
            line-height: 1.6;
        }

        .currency-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .currency-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .currency-header h1 {
            margin: 0 0 10px;
            font-size: 32px;
            color: #222;
        }

        .currency-header p {
            margin: 0;
            color: #666;
            font-size: 16px;
        }

        /* Coin section */

        .section-title {
            font-size: 26px;
            margin: 35px 0 20px;
            border-left: 5px solid #333;
            padding-left: 12px;
        }

        .coin-card {
            background: #fff;
            border-radius: 12px;
            margin-bottom: 30px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .coin-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .coin-title h3 {
            margin: 0;
            font-size: 24px;
        }

        .character-count {
            font-size: 14px;
            color: #666;
            background: #f1f1f1;
            padding: 5px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Character grid */

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .character-card {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .character-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
        }

        .character-image {
            width: 100%;
            height: 150px;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            color: #999;
            font-size: 14px;
        }

        .character-content {
            padding: 15px;
        }

        .character-content h4 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .character-content p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        /* Loading */

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fff0f0;
            color: #b00020;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .currency-container {
                margin: 20px auto;
            }

            .currency-header h1 {
                font-size: 27px;
            }

            .section-title {
                font-size: 23px;
            }

            .coin-card {
                padding: 18px;
            }

            .coin-title {
                align-items: flex-start;
                flex-direction: column;
            }

            .character-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .character-image {
                height: 120px;
            }
        }

        @media (max-width: 400px) {
            .character-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Existing website header -->
    <div id="header"></div>

    <main class="currency-container">

        <header class="currency-header">
            <h1>Nepali Currency</h1>
            <p>
                Nepalese Rupee coins, denominations and characters
            </p>
        </header>

        <h2 class="section-title">Nepalese Coins</h2>

        <div id="coinContainer">
            <div class="loading">
                Loading currency data...
            </div>
        </div>

    </main>

    <!-- Existing website footer -->
    <div id="footer"></div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        /*
         * Load existing website header and footer
         */

        $("#header").load("/assets/header.html");
        $("#footer").load("/assets/footer.html");


        /*
         * Currency JSON
         */

        const currencyURL =
            "https://shyamkumarkc20.com.np/js/currency.json";


        async function loadCurrency() {

            const container =
                document.getElementById("coinContainer");

            try {

                const response =
                    await fetch(currencyURL);

                if (!response.ok) {
                    throw new Error("Unable to load currency data.");
                }

                const data =
                    await response.json();

                displayCoins(data.coins);

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="error">
                        Unable to load Nepali currency data.
                        Please try again later.
                    </div>
                `;
            }
        }


        function displayCoins(coins) {

            const container =
                document.getElementById("coinContainer");

            if (!coins || coins.length === 0) {

                container.innerHTML = `
                    <div class="error">
                        No coin data available.
                    </div>
                `;

                return;
            }


            container.innerHTML = coins.map(coin => {

                const characters =
                    coin.characters || [];


                return `
                    <article class="coin-card">

                        <div class="coin-title">

                            <h3>
                                ${escapeHTML(coin.display)}
                            </h3>

                            <span class="character-count">
                                ${characters.length}
                                ${characters.length === 1
                                    ? "Character"
                                    : "Characters"}
                            </span>

                        </div>


                        <div class="character-grid">

                            ${characters.map((character, index) => {

                                const name =
                                    character.name || "Character " + (index + 1);

                                const description =
                                    character.description || "";

                                const image =
                                    character.image || "";


                                return `
                                    <div class="character-card">

                                        <div class="character-image">

                                            ${image
                                                ? `
                                                    <img
                                                        src="${escapeAttribute(image)}"
                                                        alt="${escapeAttribute(name)}"
                                                        loading="lazy"
                                                    >
                                                  `
                                                : `
                                                    <span class="no-image">
                                                        No image
                                                    </span>
                                                  `
                                            }

                                        </div>


                                        <div class="character-content">

                                            <h4>
                                                ${escapeHTML(name)}
                                            </h4>

                                            ${description
                                                ? `<p>${escapeHTML(description)}</p>`
                                                : ""
                                            }

                                        </div>

                                    </div>
                                `;

                            }).join("")}

                        </div>

                    </article>
                `;

            }).join("");
        }


        /*
         * Basic HTML escaping
         */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function escapeAttribute(value) {

            return escapeHTML(value);
        }


        /*
         * Start
         */

        loadCurrency();

    </script>

</body>

</html>
